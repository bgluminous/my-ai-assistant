# 构建 Windows x64 与 macOS（Apple Silicon）的发布包并发布 GitHub Release。
#
# 触发方式：
#   - 推送 Release-<版本> 分支（如 Release-1.2.3）：校验分支名与版本号一致后创建 draft Release
#     v<版本>，两个平台各自构建并上传产物，全部成功后自动发布；发布时 GitHub 在该分支的提交上
#     创建 v<版本> 标签。任一平台失败则保持 draft，重跑复用同一个 draft。
#     同一版本已发布过则直接失败；草稿中同名附件也只复用相同内容。
#     正式公开后分别登记 Windows / macOS 的 GitHub 版本索引，失败可单独重跑登记 job。
#   - 手动触发（workflow_dispatch）：只构建，产物作为 workflow artifact 保留 7 天，
#     不创建 Release，用于试跑。
#   - 推送 master 或其它分支不触发。
#
# Release 说明 = 固定的下载指引 + 随版本提交、已审阅的 docs/releases/<版本>.md。
# 日志由 agent 在发布前结合提交与代码差异编写；CI 只校验和读取，索引使用同一份正文。
# 发布后仍可在 GitHub 的 Release 页面手动编辑下载指引。
#
# 不覆盖 Intel Mac 与 Linux。prepare / publish 两个协调 job 跑在 ubuntu 上只是因为最便宜，
# 不产出 Linux 包。

name: Release

on:
  push:
    branches:
      - 'Release-*'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支的重复运行排队执行，避免并发创建或上传同一个 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: my-ai-assistant
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Check version and create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      # 完整历史与标签用于生成变更列表。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 共用本地离线入口，保留项目实际的大写 Release-* 分支格式。
      - name: Read and verify version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          conf=$(sh ci/read-version.sh)
          publish=false
          if [ "$EVENT_NAME" = "push" ]; then
            sh scripts/version-publish/check-version.sh --branch "$REF_NAME"
            publish=true
          fi
          {
            echo "version=$conf"
            echo "tag=v$conf"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Actions Secrets: TAURI_SIGNING_PRIVATE_KEY 与密码必须匹配 tauri.conf.json 中的公钥。
      # 备份并复用原私钥，重跑不能重新生成；换公钥会使已安装客户端无法验证后续更新。
      # 这是 Tauri 更新签名，Windows Authenticode / Apple 代码签名仍未配置。
      - name: Check updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo '::error::Configure updater signing secrets before building (see README.md)'
            exit 1
          fi

      - name: Verify public pricing source before release
        if: steps.meta.outputs.publish == 'true'
        run: node ci/check-pricing-source.mjs

      # RELEASE_REGISTRY_TOKEN 需要公共索引仓库的 Contents 写权限；当前仓库 token 不能跨仓写入。
      # 可选 RELEASE_TOKEN 用于项目 Release 的 Contents 写入；发布目标含工作流变更时，
      # fine-grained / App token 还需 Workflows 写权限，classic PAT 需 workflow scope。
      - name: Check registry credential is configured
        if: steps.meta.outputs.publish == 'true'
        env:
          GITHUB_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
        run: |
          if [ -z "$GITHUB_REGISTRY_TOKEN" ]; then
            echo '::error::Configure RELEASE_REGISTRY_TOKEN before publishing (see README.md)'
            exit 1
          fi

      # 下载页正文与应用内更新日志分别保存；索引和 updater 清单共用纯变更列表。
      # 缺失或未填写日志时失败，不从提交标题、正文或首版占位句生成替代内容。
      - name: Write release notes
        if: steps.meta.outputs.publish == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## 下载

          - Windows x64
            - \`${APP_NAME}_${VERSION}_x64-setup.exe\`：NSIS 安装包（推荐）
            - \`${APP_NAME}_${VERSION}_x64_en-US.msi\`：MSI 安装包
            - \`${APP_NAME}.exe\`：便携版，需要系统已安装 WebView2
          - macOS（Apple Silicon）
            - \`${APP_NAME}_${VERSION}_aarch64.dmg\`

          已安装含更新模块的版本，可在「关于」页检查更新；更旧版本需先手动安装一次。
          \`.sig\`、\`.app.tar.gz\` 与 \`updater-*.json\` 是应用内更新资源，无需手动解压。

          安装包未做代码签名：Windows SmartScreen 可能提示「未知发布者」；macOS 首次打开若提示
          「已损坏」或「无法验证开发者」，在终端执行 \`xattr -cr /Applications/${APP_NAME}.app\` 后再打开。

          EOF
          sh ci/read-release-notes.sh "$VERSION" > changelog.md
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ "$prev" = "$TAG" ]; then
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          fi
          printf '## 变更\n\n' >> notes.md
          cat changelog.md >> notes.md
          if [ -n "$prev" ]; then
            echo "完整对比：https://github.com/$GH_REPO/compare/$prev...$TAG" >> notes.md
          fi

      - name: Prepare registry input without network access
        if: steps.meta.outputs.publish == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: sh ci/register-release.sh prepare "$REF_NAME" changelog.md

      - name: Save registry input for independent retries
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-registration
          path: release-out/
          if-no-files-found: error
          retention-days: 1

      # 已发布的同版本不允许覆盖；上次失败遗留的 draft 则复用并更新指向的提交与说明。
      # Release 以 --target 指向当前提交，正式发布时 GitHub 会在该提交上创建 v<版本> 标签。
      - name: Create or reuse draft release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; bump the version instead of re-releasing"
              exit 1
            fi
            echo "Draft release $TAG already exists, updating it"
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$APP_NAME v$VERSION" --notes-file notes.md
            exit 0
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "$APP_NAME v$VERSION" \
            --notes-file notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: release-registration
          path: release-out/

      # Windows 复用仓库脚本：版本校验 + tauri build + 收集便携版 / NSIS / MSI。
      # -KeepTarget 保留 src-tauri/target 供 rust-cache 缓存依赖编译产物。
      # -SkipArchive 不打 7z，Release / artifact 按文件单独下载。
      - name: Build Windows release
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:windows -- -KeepTarget -SkipArchive -Updater

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp "release/$APP_NAME-v$VERSION-windows-x64"/* dist/

      - name: Build macOS release
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --target ${{ matrix.rust_target }} --config src-tauri/tauri.updater.conf.json

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz dist/
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz.sig dist/

      - name: Verify signatures and write updater manifest
        env:
          RELEASE_PLATFORM: ${{ matrix.name }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            node ci/updater-manifest.mjs "$RELEASE_PLATFORM" dist "release-out/$RELEASE_PLATFORM/release.json"
          else
            node ci/updater-manifest.mjs "$RELEASE_PLATFORM" dist
          fi

      - name: List artifacts
        run: ls -l dist

      - name: Upload artifacts to release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: sh ci/upload-release-assets.sh dist/*

      # Actions artifact 每个 step 仍会打成 zip，但每个 zip 里只有一个文件，
      # 试跑时可按安装包分别下载。正式 Release 由上一步按文件上传，不是 zip。
      - name: Upload NSIS (manual run)
        if: needs.prepare.outputs.publish != 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ env.VERSION }}_x64-setup.exe
          path: dist/${{ env.APP_NAME }}_${{ env.VERSION }}_x64-setup.exe
          retention-days: 7

      - name: Upload MSI (manual run)
        if: needs.prepare.outputs.publish != 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ env.VERSION }}_x64_en-US.msi
          path: dist/${{ env.APP_NAME }}_${{ env.VERSION }}_x64_en-US.msi
          retention-days: 7

      - name: Upload portable exe (manual run)
        if: needs.prepare.outputs.publish != 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}.exe
          path: dist/${{ env.APP_NAME }}.exe
          retention-days: 7

      - name: Upload dmg (manual run)
        if: needs.prepare.outputs.publish != 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ env.VERSION }}_aarch64.dmg
          path: dist/*.dmg
          retention-days: 7

      - name: Save signed updater artifacts (manual run)
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # 发布时 GitHub 在 Release 指向的提交上创建 v<版本> 标签。
      # 想保留为 draft 由人工发布，删掉这一步即可。
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,tagName,targetCommitish --jq '"published \(.tagName) at \(.targetCommitish): \(.url)"'

  # Release 已公开后只重跑失败的登记 job，复用 prepare 保存的 release-registration 输入。
  # 不重新构建、不改写已发布附件或更新说明；该输入 artifact 仅保留 1 天，应及时修复重试。
  register:
    name: Register ${{ matrix.platform }} version
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, macos-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-registration
          path: release-out/
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Verify public updater assets before registration
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node ci/verify-release-updater.mjs "$RELEASE_PLATFORM" "release-out/$RELEASE_PLATFORM/release.json"
      - name: Register existing public release asset
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
        run: sh ci/register-release.sh publish "$REF_NAME" "$RELEASE_PLATFORM"
