# bundled SQLite 体积裁剪。保留 WAL / PRAGMA / 多线程 / 自动初始化（本机切账户需要）。
# 不设 OMIT_JSON / OMIT_LOAD_EXTENSION / OMIT_WINDOWFUNC：与 libsqlite3-sys 默认 ENABLE_* 冲突。
[env]
LIBSQLITE3_FLAGS = { value = "SQLITE_DQS=0 SQLITE_DEFAULT_MEMSTATUS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_MAX_EXPR_DEPTH=0 SQLITE_OMIT_DEPRECATED SQLITE_OMIT_PROGRESS_CALLBACK SQLITE_OMIT_SHARED_CACHE SQLITE_OMIT_UTF16 SQLITE_OMIT_AUTHORIZATION SQLITE_OMIT_GET_TABLE SQLITE_OMIT_TRACE SQLITE_OMIT_EXPLAIN SQLITE_OMIT_COMPILEOPTION_DIAGS", force = true }
