[package]
name = "my-ai-assistant"
version = "1.1.0"
description = "Personal AI assistant: Cursor / ChatGPT usage and cost tracker"
authors = ["BGLuminous"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls：Windows 走 Schannel。rustls 的 JA3 会被 cursor.com（Vercel）当成非浏览器，
# Cookie 被忽略并返回 401，账户会被误标成「已失效」。
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "native-tls", "socks"] }
base64 = "0.22"
chrono = "0.4"
walkdir = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.2"
tokio = { version = "1", features = ["time", "sync"] }
# 全量备份文件的可选密码加密：PBKDF2-SHA256 派生密钥 + AES-256-GCM
aes-gcm = "0.10"
pbkdf2 = "0.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
