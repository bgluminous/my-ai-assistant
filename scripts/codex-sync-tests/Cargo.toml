[package]
name = "maa-codex-sync-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
command-stub = { path = "command-stub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
aes-gcm = "0.10"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "native-tls", "socks"] }
